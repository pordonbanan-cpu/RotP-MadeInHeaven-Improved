name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  # Always produces a playable jar (original MiH + our particle textures/lang)
  resource-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original Weever MiH (from notes if present) or skip
        run: |
          mkdir -p out
          if [ -f notes/original_Weever_MiH_1.2.5.jar ]; then
            cp notes/original_Weever_MiH_1.2.5.jar out/base.jar
          else
            echo "No base MiH jar in repo — will only package resources"
          fi

      - name: Package resource overlay jar
        run: |
          mkdir -p pack/assets/rotp_mih
          if [ -d src/main/resources/assets/rotp_mih ]; then
            cp -r src/main/resources/assets/rotp_mih/* pack/assets/rotp_mih/ || true
          fi
          cd pack && jar cf ../out/RotP-MiH-resources-overlay.jar .
          ls -lh ../out/

      - name: Upload overlay
        uses: actions/upload-artifact@v4
        with:
          name: mih-resources-overlay
          path: out/*

  # Full Forge compile (needs complete sources + RotP)
  forge-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5.1'

      - name: Download RotP from Modrinth
        run: |
          mkdir -p libs
          curl -L -o libs/jojo-1.16.5-0.2.2.2.jar \
            "https://cdn.modrinth.com/data/G62vhGwQ/versions/kaB12r0z/JJBA-RipplesOfThePast-1.16.5-0.2.2.2.jar"
          ls -lh libs/

      - name: Build with ForgeGradle
        run: gradle build --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload build libs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-build-libs
          path: |
            build/libs/
            build/reports/
          if-no-files-found: warn
