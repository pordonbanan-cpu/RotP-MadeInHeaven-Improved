name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5.1'

      - name: Check for RotP jar
        run: |
          if [ ! -f libs/jojo-1.16.5-0.2.2.2.jar ]; then
            echo "Missing libs/jojo-1.16.5-0.2.2.2.jar"
            echo "For public repo: use a private fork with the jar, or add a download step."
            ls -la libs/ || true
            exit 1
          fi

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: RotP-MadeInHeaven-Improved
          path: build/libs/*.jar
